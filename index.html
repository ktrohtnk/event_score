<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Score Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@900&family=Boogaloo&family=Ewert&family=Finger+Paint&family=Fjalla+One&family=Fredoka+One&family=Lilita+One&family=Lobster&family=Luckiest+Guy&family=Oswald:wght@700&family=Paytone+One&family=Permanent+Marker&family=Playfair+Display&family=Rock+Salt&family=Rye&family=Sancreek&family=Six+Caps&family=Ultra&display=swap&family=Rye&family=Sancreek" rel="stylesheet">
    <style>
        /* Base styling */
        body {
            background-color: #080808; /* Deep ink black */
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        /* UI Panel (Retro Typewriter / Form Aesthetic) */
        #ui-panel {
            width: 340px;
            background-color: #f0cc4f; /* Solid vintage yellow paper */
            color: #111;
            padding: 30px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto;
            font-family: "Courier New", Courier, monospace;
            border-right: 2px dashed #999;
        }

        #ui-panel h1 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .ascii-line {
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            color: #555;
            margin: 0;
        }

        #ui-panel label {
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: #111;
            font-weight: bold;
        }

        #ui-panel input[type="text"], #ui-panel select {
            font-family: "Courier New", Courier, monospace;
            padding: 8px 5px;
            font-size: 0.95rem;
            border: none;
            border-bottom: 1px dashed #111;
            background-color: transparent;
            color: #111;
            outline: none;
        }
        
        #ui-panel input[type="text"]:focus, #ui-panel select:focus {
            border-bottom: 2px solid #111;
        }

        #ui-panel button {
            font-family: "Courier New", Courier, monospace;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
            font-weight: bold;
        }

        #generate-btn {
            background-color: #080808;
            color: #f0cc4f;
            margin-top: 10px;
            border: 3px solid #080808;
            padding: 15px 10px;
            font-size: 1.3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: none; /* Flat, brutalist look */
            transition: all 0.1s ease;
            cursor: pointer;
        }

        #generate-btn .manicule {
            font-size: 2rem;
            line-height: 0;
            transform: translateY(-2px); /* Optical alignment */
        }

        #generate-btn:hover {
            background-color: #f0cc4f;
            color: #080808; /* Invert on hover like a stamped block */
        }
        
        #generate-btn:active {
            transform: scale(0.98);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-buttons button {
            flex: 1;
            background-color: transparent;
            color: #111;
            border: 1px dashed #111;
            padding: 10px;
            font-size: 0.85rem;
        }

        .action-buttons button:hover:not(:disabled) {
            background-color: #111;
            color: #f0cc4f;
        }
        
        .action-buttons button:disabled {
            border-color: #aaa;
            color: #aaa;
            cursor: not-allowed;
        }

        #ui-panel .tip-text {
            font-size: 0.8rem;
            color: #555;
            margin-top: 10px;
            text-align: center;
        }

        /* Preview Area */
        #preview-area {
            flex-grow: 1;
            display: block; 
            overflow: auto;
            padding: 40px 20px; /* Reduced padding to maximize paper visibility */
            background-size: 20px 20px;
        }

        /* A4 Paper with Texture */
        #paper {
            margin: 0 auto; /* Horizontally center */
            width: 210mm;
            height: 297mm;
            /* Scale is now handled dynamically by JS to fit window */
            transform-origin: top center;
            background-color: #eee5d3;
            background-image: 
                repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 3px),
                repeating-linear-gradient(-45deg, rgba(255,255,255,0.3) 0px, rgba(255,255,255,0.3) 1px, transparent 1px, transparent 4px);
            /* box-shadow removed for flat brutalist look */
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40mm 20mm;
            
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
        }

        #score-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            width: fit-content; /* Shrink to fit contents */
            max-width: 100%;
        }

        /* Typography Options */
        .font-univers {
            font-family: "Univers", "Helvetica Neue", Helvetica, Arial, sans-serif;
            letter-spacing: 0.5px;
        }

        .font-typewriter {
            font-family: "Courier New", Courier, monospace;
            letter-spacing: 0px;
        }

        /* Score Elements */
        #score-title {
            font-size: 24pt;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 25mm;
            letter-spacing: 2px;
            text-align: left;
            white-space: pre-wrap;
            width: fit-content;
        }

        #score-content {
            font-size: 16pt;
            line-height: 2.2;
            white-space: pre-wrap;
            max-width: 100%;
            color: #111;
            text-align: left;
            margin-left: 1.5em; /* Indent the content (bullets) relative to the title */
            font-weight: 500;
            text-shadow: 
                0.01em 0 0 #111, -0.01em 0 0 #111, 
                0 0.01em 0 #111, 0 -0.01em 0 #111;
            width: fit-content;
        }

        .score-line {
            display: flex;
            align-items: flex-start; /* Align bounding boxes at the top */
            margin-bottom: 0.2em;
        }
        
        .bullet-mark, .number-mark {
            flex-shrink: 0;
            margin-right: 28px; /* Widened slightly more based on user request */
            /* Inherit line-height from parent so bounding box matches text exactly */
        }
        
        .bullet-mark {
            /* Instead of changing font-size which breaks line-height alignment, 
               we scale it visually from its center to guarantee perfect vertical centering */
            transform: scale(1.5);
            transform-origin: center center;
        }

        /* Signature and Date */
        #score-footer {
            font-size: 14pt;
            margin-top: 30mm;
            text-align: left;
            white-space: pre-wrap;
            color: #222;
            font-weight: 500;
            text-shadow: 
                0.009em 0 0 #222, -0.009em 0 0 #222, 
                0 0.009em 0 #222, 0 -0.009em 0 #222;
            width: fit-content;
        }

        /* Stronger Ink Bleed for Univers */
        .font-univers #score-title {
            text-shadow: 
                0.01em 0 0 #111, -0.01em 0 0 #111, 0 0.01em 0 #111, 0 -0.01em 0 #111,
                0.015em 0.015em 0 rgba(17,17,17,0.6), -0.015em -0.015em 0 rgba(17,17,17,0.6);
        }
        
        .font-univers #score-content {
            font-weight: bold;
            text-shadow: 
                0.015em 0 0 #111, -0.015em 0 0 #111, 0 0.015em 0 #111, 0 -0.015em 0 #111;
        }

        .font-univers #score-footer {
            font-weight: bold;
            text-shadow: 
                0.01em 0 0 #222, -0.01em 0 0 #222, 0 0.01em 0 #222, 0 -0.01em 0 #222;
        }

        /* Typewriter/Print Misalignment Effect */
        .char {
            display: inline-block;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
            }
            #ui-panel {
                width: 100%;
                z-index: 10;
            }
            #preview-area {
                padding: 0; /* Remove padding so paper fits edge-to-edge */
            }
            /* Scale paper to exactly fit mobile screen width */
            #paper, #rendered-image {
                width: 100vw !important;
                height: calc(100vw * 1.414) !important;
                padding: 15vw 6vw !important;
                box-sizing: border-box;
                transform: scale(1) !important;
                margin-bottom: 0 !important;
            }
            #score-title {
                font-size: 7.5vw;
                margin-bottom: 8vw;
            }
            #score-content {
                font-size: 4vw;
                margin-left: 1.5em;
            }
            #score-footer {
                font-size: 3.5vw;
                margin-top: 10vw;
            }
        }

        /* Print Styles */
        @media print {
            body * {
                visibility: hidden;
            }
            #paper, #paper * {
                visibility: visible;
            }
            #paper {
                display: flex !important;
                position: absolute;
                left: 0;
                top: 0;
                box-shadow: none;
                width: 210mm !important;
                height: 297mm !important;
                padding: 50mm 40mm !important;
            }
            #rendered-image {
                display: none !important;
            }
            @page {
                size: A4;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="ascii-line">==================================</div>
        <div id="animated-logo-container" style="text-align: center; margin: 20px 0;">
            <canvas id="logo-canvas" width="300" height="200" style="display: block; margin: 0 auto;"></canvas>
            <div style="display: inline-block; font-family: 'Barlow Condensed', 'Univers', 'Helvetica Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.5px; margin-top: 0px; color: #111; font-weight:  600; margin-left: 12px;">
                EVENT SCORE GENERATOR
            </div>
        </div>
        <div class="ascii-line">==================================</div>
        
        <label>
            > Event Name:
            <input type="text" id="event-input" placeholder="e.g. WATER EVENT" value="WATER EVENT">
        </label>

        <label>
            > Signature (Author):
            <input type="text" id="signature-input" placeholder="e.g. G. Brecht" value="">
        </label>

        <label>
            > Date/Season:
            <input type="text" id="date-input" placeholder="e.g. Summer, 2026" value="Summer, 2026">
        </label>

        <div class="ascii-line">----------------------------------</div>

        <label>
            > Typography:
            <select id="font-select">
                <option value="font-typewriter">Typewriter</option>
                <option value="font-univers">Sans-serif</option>
            </select>
        </label>

        <div class="ascii-line">==================================</div>

        <button id="generate-btn" onclick="generateScore()"><span class="manicule">☞</span> GENERATE SCORE</button>
        
        <div class="action-buttons">
            <button id="download-btn" onclick="downloadJPG()" disabled>SAVE JPG</button>
            <button onclick="window.print()">PRINT / PDF</button>
        </div>
        
        <div class="tip-text">
            * On mobile, long-press<br>the paper to save image.
        </div>
        
        <div style="margin-top: auto; padding-top: 30px; text-align: center; font-family: 'Courier New', monospace; font-size: 0.8rem; opacity: 0.5; letter-spacing: 1px;">
            &copy; 2026 ktrohtnk. All Rights Reserved.
        </div>
    </div>

    <div id="preview-area">
        <div id="paper" class="font-typewriter">
            <div id="score-container">
                <div id="score-title">WATER EVENT</div>
                <div id="score-content"></div>
                <div id="score-footer"></div>
            </div>
        </div>
        <img id="rendered-image" style="display: none; width: 210mm; height: 297mm; margin: 0 auto; transform-origin: top center; object-fit: contain;">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="patterns.js?v=2"></script>
    <script>
        function downloadJPG() {
            const img = document.getElementById('rendered-image');
            if (!img.src || img.src === "") return;
            
            const titleInput = document.getElementById('event-input').value.trim();
            let fileName = titleInput ? titleInput.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase() : "event";
            
            const a = document.createElement('a');
            a.href = img.src;
            a.download = `fluxus_${fileName}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Templates array is now loaded from patterns.js

        function applyAnalogDistortion(text, isTypewriter) {
            let resultHTML = "";
            // Split by whitespace to keep words together, capturing the whitespace
            const tokens = text.split(/([\s\n]+)/);
            
            for (let i = 0; i < tokens.length; i++) {
                const token = tokens[i];
                if (token.match(/^[\s\n]+$/)) {
                    resultHTML += token;
                } else {
                    // Wrap the word to prevent mid-word breaking (Western typesetting rules)
                    resultHTML += `<span class="word" style="white-space: nowrap;">`;
                    for (let j = 0; j < token.length; j++) {
                        const char = token[j];
                        const maxShift = isTypewriter ? 0.8 : 0.2; 
                        const maxRotate = isTypewriter ? 2 : 0.5;
                        const minOpacity = isTypewriter ? 0.75 : 0.9;

                        const shiftY = (Math.random() * maxShift * 2 - maxShift).toFixed(2);
                        const shiftX = (Math.random() * maxShift - maxShift/2).toFixed(2); 
                        const rotate = (Math.random() * maxRotate * 2 - maxRotate).toFixed(2);
                        const opacity = (Math.random() * (1 - minOpacity) + minOpacity).toFixed(2);

                        resultHTML += `<span class="char" style="transform: translate(${shiftX}px, ${shiftY}px) rotate(${rotate}deg); opacity: ${opacity};">${char}</span>`;
                    }
                    resultHTML += `</span>`;
                }
            }
            return resultHTML;
        }

        function generateScore() {
            document.getElementById('download-btn').disabled = true;
            
            const input = document.getElementById('event-input').value.trim();
            const author = document.getElementById('signature-input').value.trim();
            const dateStr = document.getElementById('date-input').value.trim();
            const fontSelect = document.getElementById('font-select').value;
            const listSelect = "bullet";
            const isTypewriter = fontSelect === 'font-typewriter';
            
            const paper = document.getElementById('paper');
            const renderedImage = document.getElementById('rendered-image');

            // Reset view to DOM for generation
            paper.style.display = 'flex';
            renderedImage.style.display = 'none';

            // Set Font
            paper.className = fontSelect;

            // Process title
            let title = input.toUpperCase();
            if (!title) title = "EVENT";
            
            // Extract the noun, preserving the original casing typed by the user
            let noun = input.replace(/ EVENT$/i, '').trim();
            if (!noun) noun = "it";            
            
            // Process steps from random template
            const randomSteps = templates[Math.floor(Math.random() * templates.length)];
            
            const contentDiv = document.getElementById('score-content');
            contentDiv.innerHTML = ""; // Clear existing content

            randomSteps.forEach((step, index) => {
                let processedStep = step.replace(/{noun}/g, noun);
                // Capitalize the first letter of the sentence (unless it's empty)
                if (processedStep.length > 0) {
                    processedStep = processedStep.charAt(0).toUpperCase() + processedStep.slice(1);
                }
                // Break line after commas for poetic formatting
                processedStep = processedStep.replace(/, /g, ",\n").replace(/、/g, "、\n");

                const lineDiv = document.createElement('div');
                lineDiv.className = 'score-line';

                if (listSelect === "bullet") {
                    const markSpan = document.createElement('span');
                    markSpan.className = 'bullet-mark';
                    markSpan.innerHTML = applyAnalogDistortion("●", isTypewriter);
                    
                    const textSpan = document.createElement('span');
                    textSpan.className = 'line-text';
                    textSpan.innerHTML = applyAnalogDistortion(processedStep, isTypewriter);
                    
                    lineDiv.appendChild(markSpan);
                    lineDiv.appendChild(textSpan);
                } else if (listSelect === "number") {
                    const markSpan = document.createElement('span');
                    markSpan.className = 'number-mark';
                    markSpan.innerHTML = applyAnalogDistortion((index + 1) + ".", isTypewriter);
                    
                    const textSpan = document.createElement('span');
                    textSpan.className = 'line-text';
                    textSpan.innerHTML = applyAnalogDistortion(processedStep, isTypewriter);
                    
                    lineDiv.appendChild(markSpan);
                    lineDiv.appendChild(textSpan);
                } else {
                    lineDiv.innerHTML = applyAnalogDistortion(processedStep, isTypewriter);
                }
                
                contentDiv.appendChild(lineDiv);
            });

            // Process footer (Signature and Date)
            let footerText = "";
            if (author && dateStr) {
                footerText = author + "\n" + dateStr;
            } else if (author) {
                footerText = author;
            } else if (dateStr) {
                footerText = dateStr;
            }

            // Apply analog typewriter distortion
            document.getElementById('score-title').innerHTML = applyAnalogDistortion(title, isTypewriter);
            document.getElementById('score-footer').innerHTML = applyAnalogDistortion(footerText, isTypewriter);

            

            // Give the browser a moment to render the text and fonts, then convert to image
            setTimeout(() => {
                html2canvas(paper, { 
                    scale: 2, // High resolution
                    useCORS: true,
                    backgroundColor: "#eee5d3", // Ensure background color is captured
                    onclone: function(clonedDoc) {
                        // Remove transform only inside the hidden clone to prevent double-scaling
                        const clonedPaper = clonedDoc.getElementById('paper');
                        if (clonedPaper) {
                            clonedPaper.style.transform = 'none';
                            clonedPaper.style.margin = '0';
                        }
                    }
                }).then(canvas => {
                    renderedImage.src = canvas.toDataURL("image/jpeg", 0.9);
                    paper.style.display = 'none';
                    renderedImage.style.display = 'block';
                    document.getElementById('download-btn').disabled = false;
                    resizePaper(); // Re-apply scale to the newly visible image
                });
            }, 300);
        }


        // --- Animated Title Logo ---
        const logoCanvas = document.getElementById('logo-canvas');
        const lctx = logoCanvas.getContext('2d', { willReadFrequently: true });
        
        const fluxFonts = [
            '400 "Fredoka One", cursive',
            '400 "Paytone One", sans-serif',
            '400 "Lilita One", cursive',
            '400 "Luckiest Guy", cursive',
            '700 "Oswald", sans-serif',
            '900 "Barlow Condensed", sans-serif',
            '400 "Fjalla One", sans-serif',
            '400 "Six Caps", sans-serif',
            '400 "Permanent Marker", cursive',
            '400 "Finger Paint", cursive',
            '400 "Rock Salt", cursive',
            '400 "Lobster", cursive',
            '400 "Boogaloo", cursive',
            '400 "Playfair Display", serif',
            '400 "Ultra", serif',
            '400 "Alfa Slab One", cursive',
            '400 "Rye", cursive',
            '400 "Ewert", cursive',
            '400 "Sancreek", cursive'
        ];
        
        function drawLogoFrame() {
            lctx.clearRect(0, 0, logoCanvas.width, logoCanvas.height);
            lctx.fillStyle = '#111';
            lctx.textAlign = 'center';
            lctx.textBaseline = 'middle';
            
            // Line 1: CLick (Custom Pair Kerning)
            const line1 = "CLick";
            const font1 = 110;
            const y1 = 60;
            // 'i' is very thin, so custom X positions look much better than fixed width
            const xPos1 = [45, 105, 145, 195, 255];
            
            for (let i = 0; i < line1.length; i++) {
                const char = line1[i];
                const font = fluxFonts[Math.floor(Math.random() * fluxFonts.length)];
                const weight = font.split(' ')[0];
                const fontName = font.substring(font.indexOf('"'));
                lctx.font = `${weight} ${font1}px ${fontName}`;
                
                lctx.save();
                lctx.translate(xPos1[i], y1);
                
                if (char === 'c') { lctx.scale(-1, 1); }
                
                // Sharp jitter (No opacity drop, no blur)
                if (Math.random() < 0.4) {
                    lctx.translate((Math.random()-0.5)*6, (Math.random()-0.5)*6);
                }
                lctx.fillText(char, 0, 0);
                lctx.restore();
            }

            // Line 2: YAM (Custom Pair Kerning)
            const line2 = "YAM";
            const font2 = 115;
            const y2 = 155;
            
            // Y and A have diagonal strokes, so they need to be squeezed tighter than A and M.
            const xPositions = [
                60,   // Y center
                140,  // A center
                240   // M center
            ];
            
            for (let i = 0; i < line2.length; i++) {
                const char = line2[i];
                const font = fluxFonts[Math.floor(Math.random() * fluxFonts.length)];
                const weight = font.split(' ')[0];
                const fontName = font.substring(font.indexOf('"'));
                lctx.font = `${weight} ${font2}px ${fontName}`;
                
                lctx.save();
                lctx.translate(xPositions[i], y2);
                
                // Sharp jitter
                if (Math.random() < 0.4) {
                    lctx.translate((Math.random()-0.5)*6, (Math.random()-0.5)*6);
                }
                lctx.fillText(char, 0, 0);
                lctx.restore();
            }
            
            // motion-typography-app EXACT glitchnoise (Intensity 100)
            const glitchIntensity = 100;
            const prob = glitchIntensity / 1000;
            const blockSize = Math.max(1, Math.floor(glitchIntensity / 2));
            
            for(let gy = 0; gy < logoCanvas.height; gy += blockSize) {
                if(Math.random() < prob) {
                    const shift = Math.floor((Math.random() - 0.5) * 80);
                    // To prevent massive smearing build-up, we clear the row first (optional, but let's stick to EXACT code)
                    // The exact code in motion-typography-app didn't clear the rect, it just used putImageData
                    // But in their app, they clear the ENTIRE canvas every frame!
                    // I also clear the entire canvas every frame at the top of drawLogoFrame()
                    for(let by = 0; by < blockSize; by++) {
                        if (gy + by >= logoCanvas.height) break;
                        let rowData = lctx.getImageData(0, gy + by, logoCanvas.width, 1);
                        // Optional: fill background to avoid smearing, but we stick to exact original logic.
                        lctx.putImageData(rowData, shift, gy + by);
                    }
                }
            }
        }
        
        // Ensure fonts load before drawing first frame properly
        setTimeout(drawLogoFrame, 500);
        setInterval(drawLogoFrame, 333); // 3 fps
        // ---------------------------

        // Initialize events

        function resizePaper() {
            if (window.innerWidth <= 768) {
                // Mobile layout handles itself via CSS vw units
                document.getElementById('paper').style.transform = '';
                document.getElementById('paper').style.marginBottom = '';
                const img = document.getElementById('rendered-image');
                if (img) {
                    img.style.transform = '';
                    img.style.marginBottom = '';
                }
                return;
            }
            
            const previewArea = document.getElementById('preview-area');
            const availableHeight = previewArea.clientHeight - 80; // 40px top + 40px bottom padding
            
            const paper = document.getElementById('paper');
            const img = document.getElementById('rendered-image');
            
            // Remove transforms temporarily to get true height
            paper.style.transform = 'none';
            if (img) img.style.transform = 'none';
            
            // If paper is display:none, its offsetHeight is 0. Fall back to img or 1122.
            let paperHeight = paper.offsetHeight; 
            if (paperHeight === 0 && img) {
                paperHeight = img.offsetHeight;
            }
            if (paperHeight === 0) {
                paperHeight = 1122.5; // fallback for 297mm at 96dpi
            }
            
            let scale = availableHeight / paperHeight;
            if (scale > 1) scale = 1; // Max 100% size
            
            paper.style.transform = `scale(${scale})`;
            paper.style.marginBottom = `calc(-${paperHeight}px * ${1 - scale})`;
            
            if (img) {
                img.style.transform = `scale(${scale})`;
                img.style.marginBottom = `calc(-${paperHeight}px * ${1 - scale})`;
            }
        }
        
        window.addEventListener('resize', resizePaper);
        
        // Wait for fonts to load before initial layout, then resize
        document.fonts.ready.then(() => {
            resizePaper();
            generateScore();
        });

        document.getElementById('font-select').addEventListener('change', function() {
            document.getElementById('paper').className = this.value;
            generateScore();
        });
        

        resizePaper();
        // Generate initial score
        generateScore();
    </script>
</body>
</html>
