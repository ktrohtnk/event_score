<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Score Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@900&family=Boogaloo&family=Ewert&family=Finger+Paint&family=Fjalla+One&family=Fredoka+One&family=Lilita+One&family=Lobster&family=Luckiest+Guy&family=Oswald:wght@700&family=Paytone+One&family=Permanent+Marker&family=Playfair+Display&family=Rock+Salt&family=Rye&family=Sancreek&family=Six+Caps&family=Ultra&display=swap" rel="stylesheet">
    <style>
        /* Base styling */
        body {
            background-color: #2c2c2c;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        /* UI Panel (Retro Typewriter / Form Aesthetic) */
        #ui-panel {
            width: 340px;
            background-color: #f0cc4f; /* Vintage yellow paper */
            color: #111;
            padding: 30px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 10;
            overflow-y: auto;
            font-family: "Courier New", Courier, monospace;
            border-right: 2px dashed #999;
        }

        #ui-panel h1 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .ascii-line {
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            color: #555;
            margin: 0;
        }

        #ui-panel label {
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: #111;
            font-weight: bold;
        }

        #ui-panel input[type="text"], #ui-panel select {
            font-family: "Courier New", Courier, monospace;
            padding: 8px 5px;
            font-size: 0.95rem;
            border: none;
            border-bottom: 1px dashed #111;
            background-color: transparent;
            color: #111;
            outline: none;
        }
        
        #ui-panel input[type="text"]:focus, #ui-panel select:focus {
            border-bottom: 2px solid #111;
        }

        #ui-panel button {
            font-family: "Courier New", Courier, monospace;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
            font-weight: bold;
        }

        #generate-btn {
            background-color: #111;
            color: #f0cc4f;
            margin-top: 10px;
            border: 2px solid #111;
            padding: 15px;
            font-size: 1.1rem;
            box-shadow: 4px 4px 0px #111;
        }

        #generate-btn:hover {
            background-color: #333;
        }
        
        #generate-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-buttons button {
            flex: 1;
            background-color: transparent;
            color: #111;
            border: 1px dashed #111;
            padding: 10px;
            font-size: 0.85rem;
        }

        .action-buttons button:hover:not(:disabled) {
            background-color: #111;
            color: #f0cc4f;
        }
        
        .action-buttons button:disabled {
            border-color: #aaa;
            color: #aaa;
            cursor: not-allowed;
        }

        #ui-panel .tip-text {
            font-size: 0.8rem;
            color: #555;
            margin-top: 10px;
            text-align: center;
        }

        /* Preview Area */
        #preview-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px;
            background-image: radial-gradient(circle, #444 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* A4 Paper with Texture */
        #paper {
            width: 210mm;
            height: 297mm;
            background-color: #fcf9f2;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40mm 20mm;
            
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
        }

        #score-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            position: relative;
        }

        /* Typography Options */
        .font-univers {
            font-family: "Univers", "Helvetica Neue", Helvetica, Arial, sans-serif;
            letter-spacing: 0.5px;
        }

        .font-typewriter {
            font-family: "Courier New", Courier, monospace;
            letter-spacing: 0px;
        }

        /* Score Elements */
        #score-title {
            font-size: 24pt;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 25mm;
            letter-spacing: 2px;
            text-align: left;
            white-space: pre-wrap;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        #score-content {
            font-size: 16pt;
            line-height: 2.2;
            white-space: pre-wrap;
            max-width: 100%;
            color: #111;
            text-align: left;
            padding-left: 2em;
            font-weight: 500;
            text-shadow: 
                0.2px 0 0 #111, -0.2px 0 0 #111, 
                0 0.2px 0 #111, 0 -0.2px 0 #111;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .score-line {
            display: flex;
            align-items: flex-start;
            margin-bottom: 0.2em;
        }
        
        .bullet-mark, .number-mark {
            flex-shrink: 0;
            margin-right: 15px;
            line-height: 1;
            margin-top: 0.25em;
        }
        
        .bullet-mark {
            font-size: 1.4em;
            transform: translateY(3px);
        }

        /* Signature and Date */
        #score-footer {
            font-size: 14pt;
            margin-top: 30mm;
            text-align: left;
            white-space: pre-wrap;
            color: #222;
            font-weight: 500;
            text-shadow: 
                0.15px 0 0 #222, -0.15px 0 0 #222, 
                0 0.15px 0 #222, 0 -0.15px 0 #222;
            width: fit-content;
        }

        /* Stronger Ink Bleed for Univers */
        .font-univers #score-title {
            text-shadow: 
                0.4px 0 0 #111, -0.4px 0 0 #111, 0 0.4px 0 #111, 0 -0.4px 0 #111,
                0.3px 0.3px 0 rgba(17,17,17,0.6), -0.3px -0.3px 0 rgba(17,17,17,0.6);
        }
        
        .font-univers #score-content {
            font-weight: bold;
            text-shadow: 
                0.3px 0 0 #111, -0.3px 0 0 #111, 0 0.3px 0 #111, 0 -0.3px 0 #111;
        }

        .font-univers #score-footer {
            font-weight: bold;
            text-shadow: 
                0.2px 0 0 #222, -0.2px 0 0 #222, 0 0.2px 0 #222, 0 -0.2px 0 #222;
        }

        /* Typewriter/Print Misalignment Effect */
        .char {
            display: inline-block;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
            }
            #ui-panel {
                width: 100%;
                box-shadow: 0 2px 5px rgba(0,0,0,0.5);
                z-index: 10;
            }
            #preview-area {
                padding: 15px;
            }
            /* Scale paper down to fit mobile screen, preserving A4 ratio */
            #paper, #rendered-image {
                width: 90vw !important;
                height: calc(90vw * 1.414) !important;
                padding: 15vw 6vw !important;
                box-sizing: border-box;
            }
            #score-title {
                font-size: 7.5vw;
                margin-bottom: 8vw;
            }
            #score-content {
                font-size: 4vw;
                padding-left: 8vw;
            }
            #score-footer {
                font-size: 3.5vw;
                margin-top: 10vw;
            }
        }

        /* Print Styles */
        @media print {
            body * {
                visibility: hidden;
            }
            #paper, #paper * {
                visibility: visible;
            }
            #paper {
                display: flex !important;
                position: absolute;
                left: 0;
                top: 0;
                box-shadow: none;
                width: 210mm !important;
                height: 297mm !important;
                padding: 50mm 40mm !important;
            }
            #rendered-image {
                display: none !important;
            }
            @page {
                size: A4;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="ascii-line">==================================</div>
        <div id="animated-logo-container" style="text-align: center; margin: 20px 0;">
            <canvas id="logo-canvas" width="260" height="130" style="display: block; margin: 0 auto;"></canvas>
            <div style="font-family: sans-serif; font-size: 0.75rem; letter-spacing: 1px; margin-top: 5px; color: #111; font-weight: 900;">
                EVENT SCORE GENERATOR
            </div>
        </div>
        <div class="ascii-line">==================================</div>
        
        <label>
            > Event Name:
            <input type="text" id="event-input" placeholder="e.g. WATER EVENT" value="WATER EVENT">
        </label>

        <label>
            > Signature (Author):
            <input type="text" id="signature-input" placeholder="e.g. G. Brecht" value="">
        </label>

        <label>
            > Date/Season:
            <input type="text" id="date-input" placeholder="e.g. Summer, 2026" value="Summer, 2026">
        </label>

        <div class="ascii-line">----------------------------------</div>

        <label>
            > Typography:
            <select id="font-select">
                <option value="font-typewriter">Typewriter (Courier)</option>
                <option value="font-univers">Univers (Sans-serif)</option>
            </select>
        </label>

        <label>
            > List Style:
            <select id="list-select">
                <option value="bullet">Bullet Points (●)</option>
                <option value="number">Numbers (1. 2.)</option>
                <option value="none">None (Plain Text)</option>
            </select>
        </label>

        <div class="ascii-line">==================================</div>

        <button id="generate-btn" onclick="generateScore()">[ GENERATE SCORE ]</button>
        
        <div class="action-buttons">
            <button id="download-btn" onclick="downloadJPG()" disabled>SAVE JPG</button>
            <button onclick="window.print()">PRINT / PDF</button>
        </div>
        
        <div class="tip-text">
            * On mobile, long-press<br>the paper to save image.
        </div>
    </div>

    <div id="preview-area">
        <div id="paper" class="font-typewriter">
            <div id="score-container">
                <div id="score-title">WATER EVENT</div>
                <div id="score-content"></div>
                <div id="score-footer"></div>
            </div>
        </div>
        <img id="rendered-image" style="display: none; width: 210mm; height: 297mm; box-shadow: 0 5px 15px rgba(0,0,0,0.5); object-fit: contain;">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="patterns.js?v=2"></script>
    <script>
        function downloadJPG() {
            const img = document.getElementById('rendered-image');
            if (!img.src || img.src === "") return;
            
            const titleInput = document.getElementById('event-input').value.trim();
            let fileName = titleInput ? titleInput.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase() : "event";
            
            const a = document.createElement('a');
            a.href = img.src;
            a.download = `fluxus_${fileName}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Templates array is now loaded from patterns.js

        function applyAnalogDistortion(text, isTypewriter) {
            let resultHTML = "";
            // Split by whitespace to keep words together, capturing the whitespace
            const tokens = text.split(/([\s\n]+)/);
            
            for (let i = 0; i < tokens.length; i++) {
                const token = tokens[i];
                if (token.match(/^[\s\n]+$/)) {
                    resultHTML += token;
                } else {
                    // Wrap the word to prevent mid-word breaking (Western typesetting rules)
                    resultHTML += `<span class="word" style="white-space: nowrap;">`;
                    for (let j = 0; j < token.length; j++) {
                        const char = token[j];
                        const maxShift = isTypewriter ? 0.8 : 0.2; 
                        const maxRotate = isTypewriter ? 2 : 0.5;
                        const minOpacity = isTypewriter ? 0.75 : 0.9;

                        const shiftY = (Math.random() * maxShift * 2 - maxShift).toFixed(2);
                        const shiftX = (Math.random() * maxShift - maxShift/2).toFixed(2); 
                        const rotate = (Math.random() * maxRotate * 2 - maxRotate).toFixed(2);
                        const opacity = (Math.random() * (1 - minOpacity) + minOpacity).toFixed(2);

                        resultHTML += `<span class="char" style="transform: translate(${shiftX}px, ${shiftY}px) rotate(${rotate}deg); opacity: ${opacity};">${char}</span>`;
                    }
                    resultHTML += `</span>`;
                }
            }
            return resultHTML;
        }

        function generateScore() {
            document.getElementById('download-btn').disabled = true;
            
            const input = document.getElementById('event-input').value.trim();
            const author = document.getElementById('signature-input').value.trim();
            const dateStr = document.getElementById('date-input').value.trim();
            const fontSelect = document.getElementById('font-select').value;
            const listSelect = document.getElementById('list-select').value;
            const isTypewriter = fontSelect === 'font-typewriter';
            
            const paper = document.getElementById('paper');
            const renderedImage = document.getElementById('rendered-image');

            // Reset view to DOM for generation
            paper.style.display = 'flex';
            renderedImage.style.display = 'none';

            // Set Font
            paper.className = fontSelect;

            // Process title
            let title = input.toUpperCase();
            if (!title) title = "EVENT";
            
            // Extract the noun, preserving the original casing typed by the user
            let noun = input.replace(/ EVENT$/i, '').trim();
            if (!noun) noun = "it";            
            
            // Process steps from random template
            const randomSteps = templates[Math.floor(Math.random() * templates.length)];
            
            const contentDiv = document.getElementById('score-content');
            contentDiv.innerHTML = ""; // Clear existing content

            randomSteps.forEach((step, index) => {
                let processedStep = step.replace(/{noun}/g, noun);
                // Capitalize the first letter of the sentence (unless it's empty)
                if (processedStep.length > 0) {
                    processedStep = processedStep.charAt(0).toUpperCase() + processedStep.slice(1);
                }

                const lineDiv = document.createElement('div');
                lineDiv.className = 'score-line';

                if (listSelect === "bullet") {
                    const markSpan = document.createElement('span');
                    markSpan.className = 'bullet-mark';
                    markSpan.innerHTML = applyAnalogDistortion("●", isTypewriter);
                    
                    const textSpan = document.createElement('span');
                    textSpan.className = 'line-text';
                    textSpan.innerHTML = applyAnalogDistortion(processedStep, isTypewriter);
                    
                    lineDiv.appendChild(markSpan);
                    lineDiv.appendChild(textSpan);
                } else if (listSelect === "number") {
                    const markSpan = document.createElement('span');
                    markSpan.className = 'number-mark';
                    markSpan.innerHTML = applyAnalogDistortion((index + 1) + ".", isTypewriter);
                    
                    const textSpan = document.createElement('span');
                    textSpan.className = 'line-text';
                    textSpan.innerHTML = applyAnalogDistortion(processedStep, isTypewriter);
                    
                    lineDiv.appendChild(markSpan);
                    lineDiv.appendChild(textSpan);
                } else {
                    lineDiv.innerHTML = applyAnalogDistortion(processedStep, isTypewriter);
                }
                
                contentDiv.appendChild(lineDiv);
            });

            // Process footer (Signature and Date)
            let footerText = "";
            if (author && dateStr) {
                footerText = author + "\n" + dateStr;
            } else if (author) {
                footerText = author;
            } else if (dateStr) {
                footerText = dateStr;
            }

            // Apply analog typewriter distortion
            document.getElementById('score-title').innerHTML = applyAnalogDistortion(title, isTypewriter);
            document.getElementById('score-footer').innerHTML = applyAnalogDistortion(footerText, isTypewriter);

            // Align footer left edge to title left edge dynamically
            const titleEl = document.getElementById('score-title');
            const footerEl = document.getElementById('score-footer');
            footerEl.style.marginLeft = titleEl.offsetLeft + 'px';

            // Give the browser a moment to render the text and fonts, then convert to image
            setTimeout(() => {
                html2canvas(paper, { 
                    scale: 2, // High resolution
                    useCORS: true,
                    backgroundColor: "#fcf9f2" // Ensure background color is captured
                }).then(canvas => {
                    renderedImage.src = canvas.toDataURL("image/jpeg", 0.9);
                    paper.style.display = 'none';
                    renderedImage.style.display = 'block';
                    document.getElementById('download-btn').disabled = false;
                });
            }, 300);
        }


        // --- Animated Title Logo ---
        const logoCanvas = document.getElementById('logo-canvas');
        const lctx = logoCanvas.getContext('2d', { willReadFrequently: true });
        
        const fluxFonts = [
            '400 "Fredoka One", cursive',
            '400 "Paytone One", sans-serif',
            '400 "Lilita One", cursive',
            '400 "Luckiest Guy", cursive',
            '700 "Oswald", sans-serif',
            '900 "Barlow Condensed", sans-serif',
            '400 "Fjalla One", sans-serif',
            '400 "Six Caps", sans-serif',
            '400 "Permanent Marker", cursive',
            '400 "Finger Paint", cursive',
            '400 "Rock Salt", cursive',
            '400 "Lobster", cursive',
            '400 "Boogaloo", cursive',
            '400 "Playfair Display", serif',
            '400 "Ultra", serif',
            '400 "Alfa Slab One", cursive',
            '400 "Rye", cursive',
            '400 "Ewert", cursive',
            '400 "Sancreek", cursive'
        ];
        
        function drawLogoFrame() {
            lctx.clearRect(0, 0, logoCanvas.width, logoCanvas.height);
            lctx.fillStyle = '#111';
            lctx.textAlign = 'center';
            lctx.textBaseline = 'middle';
            
            const lines = ["CLick", "YAM"];
            
            // Size and spacing
            const fontSize = 54;
            const lineHeight = fontSize * 0.8; // line height 0.8
            const startY = 35;
            
            lines.forEach((line, lineIdx) => {
                const y = startY + lineIdx * lineHeight;
                const charWidth = 28; // Simulating kerning -11 for 54px font (very tight)
                const totalWidth = line.length * charWidth;
                let startX = (logoCanvas.width - totalWidth) / 2 + (charWidth / 2);
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    const font = fluxFonts[Math.floor(Math.random() * fluxFonts.length)];
                    lctx.font = `${fontSize}px ${font.split(' "')[1].split('",')[0]}`; // Extract just the font family name
                    // Actually, the array strings are like '400 "Oswald", sans-serif'.
                    // Can just assign directly to lctx.font if we prepend the font size properly:
                    // lctx.font = 'normal ' + fontSize + 'px ' + font.substring(font.indexOf('"'));
                    const weight = font.split(' ')[0];
                    const fontName = font.substring(font.indexOf('"'));
                    lctx.font = `${weight} ${fontSize}px ${fontName}`;
                    
                    const x = startX + i * charWidth;
                    
                    lctx.save();
                    lctx.translate(x, y);
                    
                    if (char === 'c') {
                        lctx.scale(-1, 1);
                    }
                    
                    if (Math.random() < 0.4) {
                        lctx.translate((Math.random()-0.5)*5, (Math.random()-0.5)*5);
                        lctx.globalAlpha = Math.random() * 0.4 + 0.6;
                    }
                    
                    lctx.fillText(char, 0, 0);
                    lctx.restore();
                }
            });
            
            // Glitch Noise 100
            if (Math.random() < 0.8) {
                const imgData = lctx.getImageData(0, 0, logoCanvas.width, logoCanvas.height);
                const data = imgData.data;
                const pSize = 5; 
                
                for (let y = 0; y < logoCanvas.height; y += pSize) {
                    for (let x = 0; x < logoCanvas.width; x += pSize) {
                        if (Math.random() < 0.15) {
                            const i = (y * logoCanvas.width + x) * 4;
                            const a = data[i+3];
                            if (a > 50) {
                                lctx.clearRect(x, y, pSize, pSize);
                                lctx.fillStyle = `rgba(17,17,17,${(a/255)*0.7})`;
                                lctx.fillRect(x + (Math.random() > 0.5 ? 10 : -10), y, pSize, pSize);
                            }
                        }
                    }
                }
            }
        }
        
        // Ensure fonts load before drawing first frame properly
        setTimeout(drawLogoFrame, 500);
        setInterval(drawLogoFrame, 200); // 5 fps (1000 / 5 = 200)
        // ---------------------------

        // Initialize events

        document.getElementById('font-select').addEventListener('change', function() {
            document.getElementById('paper').className = this.value;
            generateScore();
        });
        document.getElementById('list-select').addEventListener('change', generateScore);

        // Generate initial score
        generateScore();
    </script>
</body>
</html>
