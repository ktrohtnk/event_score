<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxus Event Score Generator</title>
    <style>
        /* Base styling */
        body {
            background-color: #2c2c2c;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        /* UI Panel */
        #ui-panel {
            width: 320px;
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            z-index: 10;
            overflow-y: auto;
        }

        #ui-panel h1 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        label {
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: #ccc;
        }

        input[type="text"], select, button {
            padding: 8px;
            font-size: 0.95rem;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #333;
            color: #fff;
        }

        button {
            background-color: #444;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            border: 1px solid #666;
            padding: 10px;
        }

        button:hover {
            background-color: #666;
        }

        /* Preview Area */
        #preview-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px;
            background-image: radial-gradient(circle, #444 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* A4 Paper with Texture */
        #paper {
            width: 210mm;
            height: 297mm;
            background-color: #fcf9f2;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
            padding: 50mm 40mm;
            
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
        }

        /* Typography Options */
        .font-univers {
            font-family: "Univers", "Helvetica Neue", Helvetica, Arial, sans-serif;
            letter-spacing: 0.5px;
        }

        .font-typewriter {
            font-family: "Courier New", Courier, monospace;
            letter-spacing: 0px;
        }

        /* Score Elements */
        #score-title {
            font-size: 26pt;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20mm;
            letter-spacing: 2px;
            width: 100%;
            text-align: center;
            white-space: pre-wrap;
        }

        #score-content {
            font-size: 18pt;
            line-height: 2.2;
            white-space: pre-wrap;
            max-width: 100%;
            color: #111;
        }

        /* Signature and Date */
        #score-footer {
            font-size: 14pt;
            margin-top: 30mm;
            width: 100%;
            text-align: left;
            white-space: pre-wrap;
            color: #222;
        }

        /* Typewriter/Print Misalignment Effect */
        .char {
            display: inline-block;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
            }
            #ui-panel {
                width: 100%;
                box-shadow: 0 2px 5px rgba(0,0,0,0.5);
                z-index: 10;
            }
            #preview-area {
                padding: 15px;
            }
            /* Scale paper down to fit mobile screen, preserving A4 ratio */
            #paper, #rendered-image {
                width: 90vw !important;
                height: calc(90vw * 1.414) !important;
                padding: 15vw 10vw !important;
                box-sizing: border-box;
            }
            #score-title {
                font-size: 6vw;
                margin-bottom: 8vw;
            }
            #score-content {
                font-size: 4.5vw;
            }
            #score-footer {
                font-size: 3.5vw;
                margin-top: 10vw;
            }
        }

        /* Print Styles */
        @media print {
            body * {
                visibility: hidden;
            }
            #paper, #paper * {
                visibility: visible;
            }
            #paper {
                display: flex !important;
                position: absolute;
                left: 0;
                top: 0;
                box-shadow: none;
                width: 210mm !important;
                height: 297mm !important;
                padding: 50mm 40mm !important;
            }
            #rendered-image {
                display: none !important;
            }
            @page {
                size: A4;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h1>Fluxus Score Generator</h1>
        
        <label>
            Event Name:
            <input type="text" id="event-input" placeholder="e.g., WATER EVENT" value="WATER EVENT">
        </label>

        <label>
            Signature (Author):
            <input type="text" id="signature-input" placeholder="e.g., G. Brecht" value="">
        </label>

        <label>
            Date/Season:
            <input type="text" id="date-input" placeholder="e.g., Summer, 2026" value="Summer, 2026">
        </label>

        <label>
            Typography:
            <select id="font-select">
                <option value="font-typewriter">Typewriter (Courier)</option>
                <option value="font-univers">Univers (Sans-serif)</option>
            </select>
        </label>

        <label>
            List Style:
            <select id="list-select">
                <option value="bullet">Bullet Points (●)</option>
                <option value="number">Numbers (1. 2.)</option>
                <option value="none">None (Plain Text)</option>
            </select>
        </label>

        <button onclick="generateScore()">Generate Score</button>
        <button id="download-btn" onclick="downloadJPG()" disabled>Download as JPG</button>
        <button onclick="window.print()">Print / Save as PDF</button>
        
        <div style="font-size: 0.8rem; color: #aaa; margin-top: 10px;">
            💡 On mobile, long-press the paper to save it as an image.
        </div>
    </div>

    <div id="preview-area">
        <div id="paper" class="font-typewriter">
            <div id="score-title">WATER EVENT</div>
            <div id="score-content"></div>
            <div id="score-footer"></div>
        </div>
        <img id="rendered-image" style="display: none; width: 210mm; height: 297mm; box-shadow: 0 5px 15px rgba(0,0,0,0.5); object-fit: contain;">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        function downloadJPG() {
            const img = document.getElementById('rendered-image');
            if (!img.src || img.src === "") return;
            
            const titleInput = document.getElementById('event-input').value.trim();
            let fileName = titleInput ? titleInput.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase() : "event";
            
            const a = document.createElement('a');
            a.href = img.src;
            a.download = `fluxus_${fileName}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        const templates = [
            // Observational / Time-based

            ["Sit with the {noun} in total silence."],
            ["Watch a {noun} grow old."],
            ["Measure the distance between two {noun}s."],
            ["Wait for the {noun} to forget you."],
            ["Watch the {noun} for three days and nights."],
            ["Look at the {noun} through a magnifying glass until it burns."],
            ["Wait for the {noun} to fall asleep."],
            ["Spend the rest of your life watching the {noun}."],
            ["Listen to the {noun} rust."],
            ["Watch a {noun} pass by.", "Record the time."],
            ["Count the seconds it takes for a {noun} to move."],
            ["Monitor the {noun} for signs of life."],
            ["Wait until the {noun} changes its shape."],
            ["Observe the {noun} until you know its history."],

            // Destructive / Transformative
            ["Take a {noun}.", "Cut it into 1000 pieces.", "Throw them into the wind."],
            ["Bury the {noun}.", "Dig it up in 10 years."],
            ["Light a match.", "Watch the {noun} burn.", "Collect the ashes."],
            ["Melt the {noun}."],
            ["Paint the {noun} completely black."],
            ["Boil the {noun}.", "Drink the water."],
            ["Wrap the {noun} in white paper.", "Never open it."],
            ["Drop the {noun} on a hard floor.", "Sweep it up."],
            ["Wash the {noun} until there is nothing left."],
            ["Let a {noun} slowly dissolve in rain."],
            ["Crush the {noun} with a heavy stone."],
            ["Freeze the {noun}.", "Send it to a warm country."],

            ["Paint the {noun} the color of the sky."],
            ["Leave the {noun} in the sun until its color fades."],
            ["Bite the {noun}."],

            ["Burn the {noun} and inhale the smoke."],

            // Relational / Social
            ["Send a {noun} to a friend.", "Wait for a reply."],

            ["Tell a secret to the {noun}.", "Forget the secret."],

            ["Give a {noun} to your worst enemy."],

            ["Teach the {noun} how to speak."],
            ["Introduce the {noun} to your family."],
            ["Call a random number.", "Read a description of the {noun}.", "Hang up."],
            ["Trade a {noun} for a memory."],
            ["Ask a {noun} to dance."],
            ["Whisper the name of the {noun} to a passerby."],
            ["Follow the {noun} through the streets."],
            ["Share a meal with a {noun}."],

            ["Make a {noun} your successor."],

            // Spatial / Object manipulation
            ["Place the {noun} under a piano."],
            ["Draw a line around the {noun}.", "Never cross the line."],
            ["Put a {noun} inside another {noun}."],
            ["Keep the {noun} in your pocket for a year."],
            ["A {noun} is placed on a pedestal.", "Audience leaves."],
            ["Drop a {noun} from a great height.", "Listen to the impact."],
            ["Nail a {noun} to the wall."],
            ["Hide a {noun} in a museum."],
            ["Carry a {noun} from one room to another."],
            ["Stack {noun}s as high as possible.", "Let them fall."],
            ["Find the exact center of a {noun}."],

            ["Place the {noun} exactly in the middle of a forest."],

            ["Place a {noun} in every corner of the room."],

            // Conceptual / Absurd / Impossible
            ["Do not think about {noun}."],
            ["Count every {noun} in the world."],
            ["Breathe in.", "Become the {noun}.", "Breathe out."],
            ["Find a {noun}.", "Pretend it is something else."],
            ["A {noun} that cannot be seen.", "A {noun} that cannot be touched."],
            ["Make a {noun} out of ice.", "Watch it return to water."],
            ["Spell the word '{noun}' backwards.", "Repeat until meaningless."],
            ["Try to remember a {noun} you have never seen."],
            ["Sleep next to a {noun}."],
            ["Apologize to a {noun}."],
            ["Make a {noun} out of shadow."],
            ["Think of a {noun}.", "Now forget it."],
            ["Write the word '{noun}' on a piece of paper.", "Eat the paper."],
            ["Draw a map to the nearest {noun}."],
            ["Lift the {noun} with your mind."],
            ["Convince yourself that the {noun} does not exist."],
            ["Walk in the shape of a {noun}."],
            ["Dream about a {noun}."],
            ["Paint a portrait of the {noun}'s mother."],
            ["A {noun} without a shadow."],
            ["Become a {noun} for a day."],
            ["Find the shadow of the {noun}."],
            ["Trace the outline of a {noun} on your palm."],
            ["Declare the {noun} a sovereign nation."],
            ["Calculate the weight of a {noun}."],

            // Sound / Auditory
            ["Make the sound of a {noun}."],
            ["Listen to the {noun} breathing."],
            ["Play a {noun} like an instrument."],
            ["Record the sound of a {noun}.", "Bury the tape."],
            ["A single {noun} drops.", "Silence."],
            ["Sing to the {noun} until it rains."],
            ["Wait for the {noun} to ring."],
            ["Listen to the {noun} over a telephone."],
            ["Tune the {noun} to perfect pitch."],
            ["Scream at the {noun}."],
            ["Hum the melody of a {noun}."],
            ["Record the sound of the {noun} breaking."],
            ["Make the sound of the {noun} falling."],
            ["Clap your hands for the {noun}."],
            ["Use the {noun} to make a rhythmic sound."],

            // Weather / Nature
            ["Wait for the snow to cover the {noun}."],
            ["Show the {noun} to the moon."],
            ["Let the wind carry the {noun} away."],
            ["Water the {noun} every day."],
            ["Plant a {noun}.", "Wait for spring."],
            ["Expose the {noun} to a storm."],
            ["Leave the {noun} out in the rain."],
            ["Let a {noun} dry in the wind."],
            ["Search for a {noun} in the field."],
            ["Offer the {noun} to the earth."],

            // Minimalist / Zen
            ["A {noun}."],
            ["Two {noun}s."],
            ["No {noun}."],
            ["Exit."],
            ["Enter with a {noun}."],
            ["Breathe.", "A {noun}."],
            ["One {noun} for everyone."],
            ["{noun}."],
            ["Leave."],
            ["Stop."],
            ["Begin."],
            ["Wait."],
            ["Watch."],
            ["Listen."],
            ["Do."],
            ["{noun} is.", "The {noun} is not."],
            ["The {noun} arrives.", "The {noun} departs."],
            ["Empty space.", "A {noun}."],
            ["Nothing but the {noun}."],
            ["It is a {noun}."]
        ];

        function applyAnalogDistortion(text, isTypewriter) {
            let resultHTML = "";
            // Split by whitespace to keep words together, capturing the whitespace
            const tokens = text.split(/([\s\n]+)/);
            
            for (let i = 0; i < tokens.length; i++) {
                const token = tokens[i];
                if (token.match(/^[\s\n]+$/)) {
                    resultHTML += token;
                } else {
                    // Wrap the word to prevent mid-word breaking (Western typesetting rules)
                    resultHTML += `<span class="word" style="white-space: nowrap;">`;
                    for (let j = 0; j < token.length; j++) {
                        const char = token[j];
                        const maxShift = isTypewriter ? 0.8 : 0.2; 
                        const maxRotate = isTypewriter ? 2 : 0.5;
                        const minOpacity = isTypewriter ? 0.75 : 0.9;

                        const shiftY = (Math.random() * maxShift * 2 - maxShift).toFixed(2);
                        const shiftX = (Math.random() * maxShift - maxShift/2).toFixed(2); 
                        const rotate = (Math.random() * maxRotate * 2 - maxRotate).toFixed(2);
                        const opacity = (Math.random() * (1 - minOpacity) + minOpacity).toFixed(2);

                        resultHTML += `<span class="char" style="transform: translate(${shiftX}px, ${shiftY}px) rotate(${rotate}deg); opacity: ${opacity};">${char}</span>`;
                    }
                    resultHTML += `</span>`;
                }
            }
            return resultHTML;
        }

        function generateScore() {
            document.getElementById('download-btn').disabled = true;
            
            const input = document.getElementById('event-input').value.trim();
            const author = document.getElementById('signature-input').value.trim();
            const dateStr = document.getElementById('date-input').value.trim();
            const fontSelect = document.getElementById('font-select').value;
            const listSelect = document.getElementById('list-select').value;
            const isTypewriter = fontSelect === 'font-typewriter';
            
            const paper = document.getElementById('paper');
            const renderedImage = document.getElementById('rendered-image');

            // Reset view to DOM for generation
            paper.style.display = 'flex';
            renderedImage.style.display = 'none';

            // Set Font
            paper.className = fontSelect;

            // Process title
            let title = input.toUpperCase();
            if (!title) title = "EVENT";
            
            // Extract the noun, preserving the original casing typed by the user
            let noun = input.replace(/ EVENT$/i, '').trim();
            if (!noun) noun = "it";

            // Process steps from random template
            const randomSteps = templates[Math.floor(Math.random() * templates.length)];
            let formattedContent = "";
            randomSteps.forEach((step, index) => {
                let processedStep = step.replace(/{noun}/g, noun);
                // Capitalize the first letter of the sentence (unless it's empty)
                if (processedStep.length > 0) {
                    processedStep = processedStep.charAt(0).toUpperCase() + processedStep.slice(1);
                }

                if (listSelect === "bullet") {
                    formattedContent += "●  " + processedStep + "\n";
                } else if (listSelect === "number") {
                    formattedContent += (index + 1) + ". " + processedStep + "\n";
                } else {
                    formattedContent += processedStep + "\n";
                }
            });

            // Process footer (Signature and Date)
            let footerText = "";
            if (author && dateStr) {
                footerText = author + "\n" + dateStr;
            } else if (author) {
                footerText = author;
            } else if (dateStr) {
                footerText = dateStr;
            }

            // Apply analog typewriter distortion
            document.getElementById('score-title').innerHTML = applyAnalogDistortion(title, isTypewriter);
            document.getElementById('score-content').innerHTML = applyAnalogDistortion(formattedContent, isTypewriter);
            document.getElementById('score-footer').innerHTML = applyAnalogDistortion(footerText, isTypewriter);

            // Give the browser a moment to render the text and fonts, then convert to image
            setTimeout(() => {
                html2canvas(paper, { 
                    scale: 2, // High resolution
                    useCORS: true,
                    backgroundColor: "#fcf9f2" // Ensure background color is captured
                }).then(canvas => {
                    renderedImage.src = canvas.toDataURL("image/jpeg", 0.9);
                    paper.style.display = 'none';
                    renderedImage.style.display = 'block';
                    document.getElementById('download-btn').disabled = false;
                });
            }, 300);
        }

        // Initialize events
        document.getElementById('font-select').addEventListener('change', function() {
            document.getElementById('paper').className = this.value;
            generateScore();
        });
        document.getElementById('list-select').addEventListener('change', generateScore);

        // Generate initial score
        generateScore();
    </script>
</body>
</html>
